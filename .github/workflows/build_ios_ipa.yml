name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "CFBundleShortVersionString (e.g. 1.5.0)"
        required: false
        default: "1.5.0"
      build_number:
        description: "CFBundleVersion (e.g. 15)"
        required: false
        default: "15"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

jobs:
  build-ios-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (required by Flutter 3.47 video_player_avfoundation)
        run: |
          XCODE_APP=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26 installation found under /Applications"
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Rust (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build Rust iOS framework (share_core.framework)
        run: |
          chmod +x share_app/tool/build_rust_ios.sh
          bash share_app/tool/build_rust_ios.sh \
            "${{ github.event.inputs.build_name || '1.5.0' }}" \
            "${{ github.event.inputs.build_number || github.run_number }}"

      - name: Install Flutter dependencies and analyze
        working-directory: share_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter analyze

      - name: Install CocoaPods dependencies
        working-directory: share_app/ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        working-directory: share_app
        run: |
          set -o pipefail
          BUILD_NAME="${{ github.event.inputs.build_name || '1.5.0' }}"
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" 2>&1 | tee ios_build.log || {
              grep -E "error:|Error|fatal" ios_build.log | head -n 25 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package & verify unsigned IPA
        id: package
        run: |
          BUILD_NAME="${{ github.event.inputs.build_name || '1.5.0' }}"
          APP_PATH="share_app/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found at $APP_PATH" >&2
            exit 1
          fi

          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/Runner.app
          IPA_NAME="Share-rebuild-v${BUILD_NAME}-unsigned.ipa"
          (cd ipa_stage && zip -qry "../$IPA_NAME" Payload)

          echo "=== Verifying IPA contents ==="
          ls -lh "$IPA_NAME"
          unzip -l "$IPA_NAME" | grep -E "Payload/Runner\.app/(Runner|Frameworks/share_core\.framework/share_core|Frameworks/App\.framework/flutter_assets/assets/emoticons/)" | head -n 20

          unzip -l "$IPA_NAME" | grep -q "Payload/Runner.app/Frameworks/share_core.framework/share_core" || {
            echo "ERROR: share_core.framework missing inside IPA!" >&2
            exit 1
          }
          unzip -l "$IPA_NAME" | grep -q "assets/emoticons/" || {
            echo "ERROR: emoticon assets missing inside IPA!" >&2
            exit 1
          }
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Check optional Apple signing secrets
        id: check-signing
        env:
          HAS_CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.IOS_P12_PASSWORD != '' }}
          HAS_PROF: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_PASS" = "true" ] && [ "$HAS_PROF" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed IPA (optional, when Apple signing secrets exist)
        id: signed
        if: steps.check-signing.outputs.enabled == 'true'
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PASS="$(uuidgen)"

          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          TEAM_ID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key>' \
            "  <string>${EXPORT_METHOD}</string>" \
            '  <key>signingStyle</key>' \
            '  <string>manual</string>' \
            '  <key>teamID</key>' \
            "  <string>${TEAM_ID}</string>" \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            '    <key>com.hengye.share.shareApp</key>' \
            "    <string>${PROFILE_NAME}</string>" \
            '  </dict>' \
            '</dict>' \
            '</plist>' > "$RUNNER_TEMP/ExportOptions.plist"

          cd share_app
          BUILD_NAME="${{ github.event.inputs.build_name || '1.5.0' }}"
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

          SIGNED_SRC="$(find build/ios/ipa -name '*.ipa' | head -n 1)"
          SIGNED_NAME="Share-rebuild-v${BUILD_NAME}-signed.ipa"
          cp "$SIGNED_SRC" "../$SIGNED_NAME"
          echo "signed_ipa=$SIGNED_NAME" >> "$GITHUB_OUTPUT"

          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERT_PATH" "$PROFILE_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Share-iOS-IPA
          path: |
            Share-rebuild-*-unsigned.ipa
            Share-rebuild-*-signed.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Share-rebuild-*-unsigned.ipa
            Share-rebuild-*-signed.ipa
